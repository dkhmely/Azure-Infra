name: Deploy landing zone to Azure

on:
  push:
    branches:
      - dev
      - qa
      - stage
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  ENV: ${{ github.ref_name }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  check:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform FMT check
        working-directory: IaC
        run: terraform fmt -check -recursive
      
      - name: Terraform Init (no backend)
        working-directory: IaC
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: IaC
        run: terraform validate

  plan:
    name: Terraform Plan
    if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: check
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate backend
        run: envsubst < IaC/backend-template.conf > IaC/backend.conf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        working-directory: IaC
        run: terraform init -backend-config=backend.conf
      
      - name: Terraform Plan
        working-directory: IaC
        run: terraform plan -var-file="variables/${{ env.ENV }}.tfvars" -var="env=${{ env.ENV }}" -out=tfplan

      - name: Upload tf plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: IaC/tfplan

  manual-approval-apply:
    name: Apply Approval
    runs-on: ubuntu-latest
    needs: [plan, check]
    if: success() && github.event.inputs.action == 'apply'

    permissions:
      issues: write
      contents: read

    steps:
      - name: Await for manual-approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: dkhmely
          minimum-approvals: 1
          issue-title: "Manual approval for terraform apply"
          issue-body: "Please approve terraform apply"
          exlude-workflow-initiator-as-approver: false

  apply:
    name: Terraform Apply
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    needs: manual-approval-apply
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate backend
        run: envsubst < IaC/backend-template.conf > IaC/backend.conf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        working-directory: IaC
        run: terraform init -backend-config=backend.conf
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: IaC/

      - name: Terraform Apply
        working-directory: IaC
        run: terraform apply -auto-approve tfplan

  destroy-approval:
    name: Destroy Approval
    runs-on: ubuntu-latest
    needs: check
    if: github.event.inputs.action == 'destroy'

    permissions:
      issues: write
      contents: read
      
    steps:
      - name: Await manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: dkhmely
          minimum-approvals: 1
          issue-title: "Approval Required for Terraform Destroy"
          issue-body: "Are you sure you want to destroy environment **${{ github.ref_name }}**?"

  destroy:
    name: Terraform Destroy
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    needs: destroy-approval
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Branch Name
        run: echo "ENV=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Generate backend.conf
        run: envsubst < IaC/backend-template.conf > IaC/backend.conf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: IaC
        run: terraform init -backend-config="backend.conf"

      - name: Terraform Destroy
        working-directory: IaC
        run: terraform destroy -auto-approve -var="env=${{ env.ENV }}"
